services:
  app:
    build: .
    volumes:
      - .:/app
      - ./vault:/app/vault
    env_file:
      - .env

  ui:
    build: .
    volumes:
      - .:/app
      - ./vault:/app/vault
      - ./sessions:/app/sessions
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
    ports:
      - "8501:8501"
    command: streamlit run src/ui/app.py --server.address=0.0.0.0
